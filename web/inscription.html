<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Akouss Kalara</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-etroite">
  <div class="carte" style="padding:32px;" id="carte-inscription">
    <h2 style="margin-bottom:4px;">📚 AKOUSS KALARA</h2>
    <h1 style="font-size:20px; margin:16px 0 4px;">Créer un compte</h1>
    <p style="color:var(--texte-clair); font-size:13px; margin-bottom:20px;">Rejoignez Akouss Kalara</p>

    <div id="zone-message"></div>

    <form id="form-inscription">
      <div class="champ-groupe">
        <label class="champ-label">Nom complet</label>
        <input class="champ" name="nom_complet" required>
      </div>
      <div class="champ-groupe">
        <label class="champ-label">Email</label>
        <input class="champ" type="email" name="email" required>
      </div>
      <div class="champ-groupe">
        <label class="champ-label">Téléphone</label>
        <input class="champ" name="telephone" placeholder="6XXXXXXXX">
      </div>
      <div class="champ-groupe">
        <label class="champ-label">Mot de passe</label>
        <input class="champ" type="password" name="mot_de_passe" required minlength="8">
      </div>

      <div style="background:var(--fond); border-radius:8px; padding:14px; margin-bottom:20px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600;">
          <input type="checkbox" id="case-vendeur"> Je souhaite aussi devenir vendeur
        </label>
        <div id="zone-boutique" style="display:none; margin-top:10px;">
          <label class="champ-label">Nom de votre boutique</label>
          <input class="champ" name="nom_boutique">
          <p style="font-size:11px; color:var(--texte-clair); margin-top:6px;">
            Votre statut vendeur sera activé après confirmation de votre email.
          </p>
        </div>
      </div>

      <button type="submit" class="btn btn-primaire" style="width:100%;">S'inscrire</button>
    </form>

    <p class="centre espace-haut" style="font-size:13px;">
      Déjà un compte ? <a href="connexion.html" style="color:var(--accent); font-weight:600;">Se connecter</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/inscription.js"></script>
</body>
</html>
